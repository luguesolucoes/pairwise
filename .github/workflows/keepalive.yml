# Keeps a free-tier host (Render and the like) awake by pinging /api/health every ~10
# minutes, so the app never pays a cold start. Free hosts spin down after ~15 min idle.
#
# Set the repository variable PAIRWISE_URL to your deployment's base URL
# (Settings -> Secrets and variables -> Actions -> Variables). If unset, it falls back
# to the value below. GitHub may delay scheduled runs under load, so 10 min leaves margin.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.PAIRWISE_URL || 'https://pairwise-uer7.onrender.com' }}"
          echo "Pinging $url/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 120 "$url/api/health" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "health never returned 200"
          exit 1
